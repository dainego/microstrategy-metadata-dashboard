name: Build and publish dashboard images

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "agent/**"
      - "deploy/Dockerfile"
      - "deploy/nginx.conf"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/dainego/microstrategy-metadata-dashboard-dashboard:${{ github.sha }}
            ghcr.io/dainego/microstrategy-metadata-dashboard-dashboard:latest

      - name: Build and publish MetrIA agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/Dockerfile
          push: true
          tags: |
            ghcr.io/dainego/microstrategy-metadata-dashboard-agent:${{ github.sha }}
            ghcr.io/dainego/microstrategy-metadata-dashboard-agent:latest

      - name: Register immutable image versions in Kustomize
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("deploy/kubernetes/kustomization.yaml")
          content = path.read_text(encoding="utf-8")
          tag = os.environ["IMAGE_TAG"]
          for image_name in ("dashboard-image", "catalog-agent-image"):
            pattern = rf"(name: {image_name}\n\s+newName: [^\n]+\n\s+newTag: )[^\n]+"
            content, replacements = re.subn(pattern, rf"\g<1>{tag}", content)
            if replacements != 1:
              raise RuntimeError(f"No se pudo actualizar la imagen {image_name}.")
          path.write_text(content, encoding="utf-8")
          PY

      - name: Commit image versions for Argo CD
        run: |
          if git diff --quiet -- deploy/kubernetes/kustomization.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/kubernetes/kustomization.yaml
          git commit -m "chore: actualiza imágenes desplegables"
          git push
