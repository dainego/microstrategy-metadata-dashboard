apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microstrategy-metadata-dashboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dainego/microstrategy-metadata-dashboard.git
    targetRevision: main
    path: deploy/kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: metadata-dashboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
