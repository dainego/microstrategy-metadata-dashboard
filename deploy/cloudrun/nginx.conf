server {
    # Cloud Run dirigirá el tráfico externo al contenedor dashboard por este puerto.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El agente ADK es un sidecar: no tiene URL pública propia.
    location /agent/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;

        # El navegador se comunica con el mismo origen. Se normalizan estos
        # encabezados para que ADK acepte la solicitud interna del proxy.
        proxy_set_header Host localhost:8080;
        proxy_set_header Origin http://localhost:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
