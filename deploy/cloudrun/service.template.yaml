apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: metria-dashboard
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Sin instancias mínimas: el servicio escala a cero cuando no recibe tráfico.
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 4
      timeoutSeconds: 120
      serviceAccountName: SERVICE_ACCOUNT_EMAIL
      containers:
        # El primer contenedor recibe el tráfico público de Cloud Run.
        - name: dashboard
          image: DASHBOARD_IMAGE
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
        # Este contenedor solo es accesible desde Nginx por localhost:8000.
        - name: catalog-agent
          image: AGENT_IMAGE
          env:
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "FALSE"
            - name: CATALOG_PATH
              value: /app/catalog/catalog.json
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: metria-google-api
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
