apiVersion: apps/v1
kind: Deployment
metadata:
  name: microstrategy-metadata-dashboard
  labels:
    app: microstrategy-metadata-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microstrategy-metadata-dashboard
  template:
    metadata:
      labels:
        app: microstrategy-metadata-dashboard
    spec:
      containers:
        - name: dashboard
          image: REGISTRY_URL/microstrategy-metadata-dashboard:1.0.0
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30