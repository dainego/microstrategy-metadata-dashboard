apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: microstrategy-metadata-dashboard
spec:
  parentRefs:
    - name: GATEWAY_NAME
      namespace: GATEWAY_NAMESPACE
      sectionName: https
  hostnames:
    - metadata-dashboard.empresa.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: microstrategy-metadata-dashboard
          port: 80