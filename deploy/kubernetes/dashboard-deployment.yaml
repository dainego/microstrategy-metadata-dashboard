apiVersion: apps/v1
kind: Deployment
metadata:
  name: microstrategy-metadata-dashboard
  labels:
    app: microstrategy-metadata-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microstrategy-metadata-dashboard
  template:
    metadata:
      labels:
        app: microstrategy-metadata-dashboard
    spec:
      containers:
        - name: dashboard
          image: dashboard-image
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
